# Same-origin API for the in-browser monitor. tdc_server.py also binds :8080
# for PC clients (tdc_monitor.py / delay sweep) after Start.

location ^~ /pitaya_tdc/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}

location ^~ /pitaya_tdc/control/ {
    proxy_pass http://127.0.0.1:12780/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
}
