# Same-origin API for the in-browser monitor. tdc_server.py also binds :8080
# for PC clients (tdc_monitor.py / delay sweep) while this app is open.

location /pitaya_tdc/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}
